# Ecobee — Home Assistant theme
# Palette drawn from ecobee product UI + brand:
#   Brand green  #00A651
#   Device black #1A1A1A
#   Heat orange  #FF8C1A  (active heating / squircle glow)
#   Cool blue    #2B9BDB  (active cooling / squircle glow)
#   Neutrals     Carbon / app surfaces (#595352, #F5F5F5, #F9F9F9)
#
# Install:
#   1. Copy this file to config/themes/ecobee.yaml
#   2. In configuration.yaml ensure:
#        frontend:
#          themes: !include_dir_merge_named themes
#   3. Developer Tools → Actions → frontend.reload_themes
#   4. Profile → Theme → Ecobee

Ecobee:
  # Shared (both modes)
  primary-color: "#00A651"
  accent-color: "#FF8C1A"
  light-primary-color: "#2EBF6E"
  dark-primary-color: "#008F45"

  # Climate / HVAC — match thermostat heat(orange) / cool(blue)
  state-climate-heat-color: "#FF8C1A"
  state-climate-cool-color: "#2B9BDB"
  state-climate-heat-cool-color: "#00A651"
  state-climate-auto-color: "#00A651"
  state-climate-fan_only-color: "#72B8AC"
  state-climate-dry-color: "#EB9D87"
  state-climate-idle-color: "#8A8A8A"
  state-climate-off-color: "#8A8A8A"

  # Occupancy / presence — bastion teal family
  state-binary_sensor-occupancy-on-color: "#00A651"
  state-binary_sensor-occupancy-off-color: "#8A8A8A"
  state-binary_sensor-active-color: "#00A651"

  # Generic active / switches lean brand green (not amber)
  state-active-color: "#00A651"
  state-inactive-color: "#8A8A8A"
  state-switch-active-color: "#00A651"
  state-fan-active-color: "#2B9BDB"
  state-person-home-color: "#00A651"

  # Error / warning — Hearth family
  error-color: "#E3543B"
  warning-color: "#EB9D87"
  success-color: "#00A651"
  info-color: "#2877CD"

  # Cards / chrome (shared shape cues)
  ha-card-border-radius: "16px"
  ha-card-border-width: "0px"
  mdc-shape-small: "8px"
  mdc-shape-medium: "12px"

  modes:
    light:
      # App-adjacent light surfaces
      primary-background-color: "#F5F5F5"
      secondary-background-color: "#EDEDEB"
      card-background-color: "#FFFFFF"
      ha-card-background: "#FFFFFF"
      lovelace-background: "#F5F5F5"
      primary-text-color: "#1A1A1A"
      secondary-text-color: "#595352"
      disabled-text-color: "#A8A6A4"
      text-primary-color: "#FFFFFF"
      divider-color: "#DCDCDA"
      app-header-background-color: "#1A1A1A"
      app-header-text-color: "#FFFFFF"
      app-header-selection-bar-color: "#00A651"
      sidebar-background-color: "#FFFFFF"
      sidebar-text-color: "#1A1A1A"
      sidebar-selected-text-color: "#00A651"
      sidebar-selected-icon-color: "#00A651"
      sidebar-icon-color: "#595352"
      input-fill-color: "#F9F9F9"
      input-ink-color: "#1A1A1A"
      input-disabled-fill-color: "#EDEDEB"
      input-disabled-ink-color: "#A8A6A4"
      input-idle-line-color: "#DCDCDA"
      input-hover-line-color: "#00A651"
      switch-checked-color: "#00A651"
      switch-checked-button-color: "#FFFFFF"
      switch-checked-track-color: "#72B8AC"
      switch-unchecked-button-color: "#F9F9F9"
      switch-unchecked-track-color: "#DCDCDA"
      paper-slider-active-color: "#00A651"
      paper-slider-knob-color: "#00A651"
      paper-slider-container-color: "#DCDCDA"
      mdc-theme-primary: "#00A651"
      mdc-theme-secondary: "#FF8C1A"
      mdc-text-field-fill-color: "#F9F9F9"
      ha-panel-background: "#F5F5F5"
      ha-panel-toolbar-background: "#FFFFFF"
      ha-data-table-background: "#FFFFFF"
      rgb-primary-color: "0, 166, 81"
      rgb-accent-color: "255, 140, 26"
      rgb-primary-text-color: "26, 26, 26"
      rgb-secondary-text-color: "89, 83, 82"
      rgb-disabled-text-color: "168, 166, 164"
      rgb-card-background-color: "255, 255, 255"

    dark:
      # Thermostat-screen dark
      primary-background-color: "#1A1A1A"
      secondary-background-color: "#111111"
